[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mar2300-spot-detection"
version = "0.1.0"
description = "Local spot detection on MAR2300 detector images"
requires-python = ">=3.11"
dependencies = ["fabio>=2024.9", "numpy>=1.26"]

[project.optional-dependencies]
ml = ["torch>=2.5"]

[project.scripts]
mar-spots = "mar_spots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
